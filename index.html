<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Gubby Calendar — a fast personal calendar with US holidays and a day-first agenda.">
<title>Gubby Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='7' y='9' width='18' height='16' rx='3' fill='white'/%3E%3Crect x='7' y='9' width='18' height='5' rx='3' fill='%23c7d2fe'/%3E%3Ccircle cx='16' cy='19' r='2.5' fill='%234f46e5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="5" width="18" height="16" rx="3"></rect>
            <path d="M3 10h18M8 3v4M16 3v4"></path>
          </svg>
        </span>
        <span class="brand-text">Gubby<span class="brand-dim">Calendar</span></span>
      </div>

      <div class="period">
        <button class="icon-btn" id="prevBtn" type="button" title="Previous (←)" aria-label="Previous period">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <button class="today-btn" id="todayBtn" type="button" title="Jump to today (T)">Today</button>
        <button class="icon-btn" id="nextBtn" type="button" title="Next (→)" aria-label="Next period">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <h1 class="period-title" id="periodTitle" aria-live="polite">Today</h1>
      </div>

      <div class="topbar-actions">
        <div class="segmented" id="viewSwitch" role="tablist" aria-label="Calendar view">
          <button class="seg" type="button" data-view="month" role="tab" title="Month view (M)">Month</button>
          <button class="seg" type="button" data-view="week" role="tab" title="Week view (W)">Week</button>
          <button class="seg" type="button" data-view="day" role="tab" title="Day view (D)">Day</button>
          <span class="seg-thumb" id="segThumb" aria-hidden="true"></span>
        </div>
        <button class="primary-btn" id="addBtn" type="button" title="New event (N)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          <span>New event</span>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle color theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13.2A8.6 8.6 0 1110.8 3a6.9 6.9 0 1010.2 10.2z"></path></svg>
        </button>
      </div>
    </div>

    <div class="topbar-sub">
      <div class="nextup" id="nextUp" aria-live="polite"></div>
      <label class="toggle" title="Show non-federal holidays and observances">
        <input type="checkbox" id="obsToggle" checked>
        <span class="toggle-track" aria-hidden="true"><span class="toggle-dot"></span></span>
        <span class="toggle-label">Observances</span>
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="pane" id="pane" aria-label="Calendar"></section>

    <aside class="sidebar" id="sidebar" aria-label="Selected day">
      <div class="side-head">
        <div class="side-date">
          <span class="side-weekday" id="sideWeekday">Monday</span>
          <span class="side-daynum" id="sideDayNum">3</span>
        </div>
        <div class="side-month" id="sideMonth">October 2026</div>
      </div>

      <div class="side-section" id="holidaySection" hidden>
        <h2 class="side-h">Holidays</h2>
        <ul class="holiday-list" id="holidayList"></ul>
      </div>

      <div class="side-section side-grow">
        <h2 class="side-h">
          Events
          <span class="side-count" id="eventCount"></span>
        </h2>
        <ul class="agenda" id="agenda"></ul>
        <button class="dashed-add" id="sideAddBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          Add event on this day
        </button>
      </div>

      <div class="side-section" id="upcomingSection">
        <h2 class="side-h">Upcoming holidays</h2>
        <ul class="upcoming" id="upcoming"></ul>
      </div>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="hint"><kbd>T</kbd> today</span>
    <span class="hint"><kbd>M</kbd> month</span>
    <span class="hint"><kbd>W</kbd> week</span>
    <span class="hint"><kbd>D</kbd> day</span>
    <span class="hint"><kbd>N</kbd> new event</span>
    <span class="hint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate</span>
    <span class="spacer"></span>
    <span class="saved" id="savedFlag" aria-live="polite">Saved locally</span>
  </footer>
</div>

<dialog class="modal" id="eventDialog" aria-labelledby="dialogTitle">
  <form method="dialog" id="eventForm">
    <header class="modal-head">
      <h2 id="dialogTitle">New event</h2>
      <button class="icon-btn" type="button" id="dialogClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </header>

    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Title</label>
        <input id="fTitle" name="title" type="text" placeholder="Dentist appointment" autocomplete="off" maxlength="90" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fDate">Date</label>
          <input id="fDate" name="date" type="date" required>
        </div>
        <div class="field">
          <label for="fTime">Time</label>
          <input id="fTime" name="time" type="time" step="300" required>
        </div>
        <div class="field field-narrow">
          <label for="fLength">For</label>
          <select id="fLength" name="length">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60" selected>1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
            <option value="180">3 hours</option>
            <option value="240">4 hours</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="fAddress">Address <span class="opt">optional</span></label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <input id="fAddress" name="address" type="text" placeholder="123 Main St, Springfield" autocomplete="off" maxlength="160">
        </div>
      </div>

      <div class="field">
        <label for="fDesc">Description <span class="opt">optional</span></label>
        <textarea id="fDesc" name="description" rows="3" placeholder="Details, who to bring, what to prepare…"></textarea>
      </div>

      <div class="color-row">
        <span class="color-label">Color</span>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Event color"></div>
      </div>
    </div>

    <footer class="modal-foot">
      <button class="danger-btn" id="deleteBtn" type="button" hidden>Delete</button>
      <span class="spacer"></span>
      <button class="ghost-btn" id="cancelBtn" type="button">Cancel</button>
      <button class="primary-btn" id="saveBtn" type="submit">Save event</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="holidays.js"></script>
<script src="app.js"></script>
</body>
</html>
